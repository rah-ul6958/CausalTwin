# Render Blueprint for the CausalTwin backend (the frontend is deployed on Vercel).
# Step-by-step instructions, plan sizing and the post-deploy checklist: docs/DEPLOYMENT.md
services:
  - type: web
    name: causaltwin-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # "free" is 0.1 CPU / 512 MB and sleeps after 15 idle minutes; the app runs on it but slowly.
    # For judging, a paid plan such as 0.5c-512mb (legacy name "starter") or 1c-2g is recommended.
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # The Vercel URL of the frontend, for example https://causaltwin.vercel.app (asked on first deploy).
      - key: CAUSALTWIN_CORS_ORIGINS
        sync: false
      # Optional: allow Vercel preview deployments, for example https://causaltwin-.*\.vercel\.app
      - key: CAUSALTWIN_CORS_ORIGIN_REGEX
        sync: false
      - key: CAUSALTWIN_DISCOVERY_JOBS
        value: "1"
      - key: CAUSALTWIN_ALLOW_BENCHMARK_RUN
        value: "0"
      # Each browser tab gets its own private live simulation, up to this many at once (later viewers
      # share one). Every watched simulation needs CPU: 2 suits the free plan, 3 to 4 a paid one.
      # Simulations step only while someone watches them, so unused ones cost no CPU.
      - key: CAUSALTWIN_MAX_SESSIONS
        value: "2"
      - key: CAUSALTWIN_AUTOSTART
        value: "1"
