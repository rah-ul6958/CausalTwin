# One command for the whole system on a laptop:  docker compose up --build
# Then open http://localhost:3000 (the backend API is on http://localhost:8000/docs).
# Optional settings: copy .env.example to .env and edit (see the comments there).
services:
  backend:
    build: ./backend
    image: causaltwin-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      CAUSALTWIN_CORS_ORIGINS: ${CAUSALTWIN_CORS_ORIGINS:-http://localhost:3000}
      CAUSALTWIN_DISCOVERY_JOBS: ${CAUSALTWIN_DISCOVERY_JOBS:-2}
      CAUSALTWIN_ALLOW_BENCHMARK_RUN: ${CAUSALTWIN_ALLOW_BENCHMARK_RUN:-1}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/stream}
    image: causaltwin-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
